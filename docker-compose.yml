name: spk

services:

  db:
    image: mysql:8.0
    container_name: spk_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spk_smkn
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - spk_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - spk_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spk-smkn-app:latest
    restart: unless-stopped
    working_dir: /var/www
    networks:
      - spk_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: spk-nginx:latest
    container_name: spk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      spk_network:
        aliases:
          - nginx
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: spk_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - spk_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - spk_network

  grafana:
    image: grafana/grafana:latest
    container_name: spk_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - spk_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - spk_network
    depends_on:
      - prometheus

  mysql_exporter:
    image: prom/mysqld-exporter:latest
    container_name: spk_mysql_exporter
    restart: unless-stopped
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=root"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "9104:9104"
    networks:
      - spk_network
    depends_on:
      db:
        condition: service_healthy

  php_fpm_exporter:
    image: hipages/php-fpm_exporter:latest
    container_name: spk_php_fpm_exporter
    restart: unless-stopped
    environment:
      PHP_FPM_SCRAPE_URI: "tcp://app:9000/status"
    ports:
      - "9253:9253"
    networks:
      - spk_network
    depends_on:
      - app

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: spk_nginx_exporter
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx:80/stub_status'
    ports:
      - "9113:9113"
    networks:
      - spk_network
    depends_on:
      - nginx

networks:
  spk_network:
    external: true

volumes:
  spk_db_data:
  spk_prometheus_data:
  spk_grafana_data:
