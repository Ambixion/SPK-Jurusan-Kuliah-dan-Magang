version: '3.8'

# ============================================================================
# Docker Swarm Stack — SPK SMKN 5 Jember
# Deploy: docker stack deploy -c docker-stack.yml spk_stack
# ============================================================================

services:

  # ── Laravel App (PHP-FPM) — 3 replicas ───────────────────────────────────
  app:
    image: spk-smkn-app:latest
    deploy:
      replicas: 3
      update_config:
        parallelism: 1          # update 1 container at a time
        delay: 10s              # wait 10s between each update
        order: start-first      # start new before stopping old (zero downtime)
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-spk_smkn}
      - DB_USERNAME=${DB_USERNAME:-spk_user}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      - app_storage:/var/www/storage
    networks:
      - spk_overlay
    depends_on:
      - db

  # ── Nginx — 2 replicas ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: ingress         # Swarm load balancer
    volumes:
      - app_public:/var/www/public
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    networks:
      - spk_overlay
    depends_on:
      - app

  # ── MySQL Database — 1 replica (stateful) ────────────────────────────────
  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-spk_smkn}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root}
      - MYSQL_USER=${DB_USERNAME:-spk_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-root}
    volumes:
      - spk_db_data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager    # DB hanya di manager node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - spk_overlay

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_conf
        target: /etc/prometheus/prometheus.yml
    volumes:
      - spk_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - spk_overlay

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - spk_grafana_data:/var/lib/grafana
      - grafana_provisioning:/etc/grafana/provisioning
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - spk_overlay
    depends_on:
      - prometheus

  # ── MySQL Exporter ────────────────────────────────────────────────────────
  mysql_exporter:
    image: prom/mysqld-exporter:latest
    environment:
      - DATA_SOURCE_NAME=root:${DB_PASSWORD:-root}@(db:3306)/
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    networks:
      - spk_overlay

configs:
  nginx_conf:
    file: ./nginx.conf
  prometheus_conf:
    file: ./docker/prometheus/prometheus.yml

networks:
  spk_overlay:
    driver: overlay
    attachable: true

volumes:
  spk_db_data:
  spk_prometheus_data:
  spk_grafana_data:
  app_storage:
  app_public:
  grafana_provisioning:
