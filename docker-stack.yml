version: '3.8'

services:
  app:
    image: sistem-pengambil-keputusan-pemilihan-jurusan-kuliah-dan-magang-app
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
    volumes:
      - .:/var/www

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
