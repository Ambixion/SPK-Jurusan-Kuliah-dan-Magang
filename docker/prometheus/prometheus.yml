global:
  scrape_interval: 15s       # mengambil matrics setiap 15 detik sekali
  evaluation_interval: 15s   # mengevaluasi rules setiap 15 detik
  scrape_timeout: 10s

# Alerting rules (opsional, bisa dikembangkan)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MySQL metrics
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql_exporter:9104']
    metrics_path: /metrics
    scrape_interval: 30s

  # Nginx metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
    metrics_path: /metrics
    scrape_interval: 15s

  # Laravel App (PHP-FPM status jika diaktifkan)
  - job_name: 'php-fpm'
    static_configs:
      - targets: ['php_fpm_exporter:9253']
    scrape_interval: 30s
